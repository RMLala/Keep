name: Passkeep Android
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run AppForge V3 static tests
        run: npm test
      - name: Build web assets and standalone HTML
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Passkeep-HTML-Standalone
          path: Passkeep-Standalone.html
          if-no-files-found: error
      - name: Create Android project
        run: npx cap add android
      - name: Sync plugins
        run: npx cap sync android
      - name: Configure API variants
        run: node scripts/configure-android.mjs
      - name: Build Debug variants
        run: cd android && ./gradlew assembleApi23Debug assembleApi29Debug
      - name: Check release signing configuration
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then echo 'ready=true' >> $GITHUB_OUTPUT; else echo 'ready=false' >> $GITHUB_OUTPUT; fi
      - name: Explain PR secret restriction
        if: github.event_name == 'pull_request' && steps.signing.outputs.ready != 'true'
        run: echo "Release signing check skipped on pull_request: repository secrets are not exposed to this event. This does not indicate that repository secrets are absent."
      - name: Fail push/manual run if release secrets are unavailable
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready != 'true'
        run: |
          echo "::error::Release signing secrets unavailable. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD in GitHub Actions secrets."
          exit 1
      - name: Configure release signing key
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/android-release.jks
          chmod 600 android/app/android-release.jks
      - name: Build signed Release variants
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready == 'true'
        env:
          PASSKEEP_STORE_FILE: ${{ github.workspace }}/android/app/android-release.jks
          PASSKEEP_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PASSKEEP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PASSKEEP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew assembleApi23Release assembleApi29Release -PversionCode="$VERSION_CODE"
      - name: Verify both Release APK signatures
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          A23="android/app/build/outputs/apk/api23/release/app-api23-release.apk"
          A29="android/app/build/outputs/apk/api29/release/app-api29-release.apk"
          test -f "$A23" || { echo "::error::API23 Release APK missing: $A23"; exit 1; }
          test -f "$A29" || { echo "::error::API29 Release APK missing: $A29"; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$A23"
          "$APKSIGNER" verify --verbose --print-certs "$A29"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && steps.signing.outputs.ready == 'true'
        with:
          name: Passkeep-Release-Signed-API23-API29
          path: |
            android/app/build/outputs/apk/api23/release/*.apk
            android/app/build/outputs/apk/api29/release/*.apk
          if-no-files-found: error
      - name: Package complete source project
        run: |
          zip -r Passkeep-Source-Project.zip . -x ".git/*" "node_modules/*" "android/*" "dist/*" "Passkeep-Source-Project.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Passkeep-Source-Project
          path: Passkeep-Source-Project.zip
          if-no-files-found: error
