name: Passkeep Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync plugins
        run: npx cap sync android
      - name: Configure API variants
        run: node scripts/configure-android.mjs
      - name: Build Debug variants
        run: cd android && ./gradlew assembleApi23Debug assembleApi29Debug
      - uses: actions/upload-artifact@v4
        with:
          name: Passkeep-Debug-API23-API29
          path: |
            android/app/build/outputs/apk/api23/debug/*.apk
            android/app/build/outputs/apk/api29/debug/*.apk
          if-no-files-found: error
      - name: Check release signing configuration
        id: signing
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then echo 'ready=true' >> $GITHUB_OUTPUT; else echo 'ready=false' >> $GITHUB_OUTPUT; fi
      - name: Configure release signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/android-release.jks
      - name: Build signed Release variants
        if: steps.signing.outputs.ready == 'true'
        env:
          PASSKEEP_STORE_FILE: ${{ github.workspace }}/android/app/android-release.jks
          PASSKEEP_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PASSKEEP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PASSKEEP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew assembleApi23Release assembleApi29Release -PversionCode="$VERSION_CODE"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: Passkeep-Release-Signed-API23-API29
          path: |
            android/app/build/outputs/apk/api23/release/*.apk
            android/app/build/outputs/apk/api29/release/*.apk
          if-no-files-found: error
      - name: Release signing secrets missing
        if: steps.signing.outputs.ready != 'true'
        run: |
          echo "Release APK skipped: configure the four signing secrets in repository settings."
